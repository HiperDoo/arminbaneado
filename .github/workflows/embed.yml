name: Actualizar contador de la vista previa de Discord

# Discord solo lee el JSON de la vista previa desde el mismo dominio que la web.
# Cada 10 minutos se copia /api/embed.json (con el número de firmas) a embed.json.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar el embed con el contador
        id: fetch
        run: |
          api="$(jq -r '.api_url' config.json)"
          if ! curl -fsS --max-time 20 "$api/api/embed.json" -o /tmp/embed.json; then
            echo "La API no respondió; se mantiene el embed actual."; exit 0
          fi
          if ! jq -e '.component.type == 17' /tmp/embed.json > /dev/null; then
            echo "Respuesta inválida; se mantiene el embed actual."; exit 0
          fi
          jq -c . /tmp/embed.json > /tmp/embed.min.json
          if [ "$(wc -c < /tmp/embed.min.json)" -ge 3000 ]; then
            echo "El embed supera 3.000 bytes; Discord lo rechazaría."; exit 0
          fi
          cp /tmp/embed.min.json embed.json

      - name: Guardar si cambió
        run: |
          git diff --quiet embed.json && { echo "Sin cambios."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar contador de la vista previa de Discord" embed.json
          git push
